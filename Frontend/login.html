<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - CauseConnect</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="auth-wrap">
  <div class="auth-card reveal-scale">
    <div class="auth-head">
      <img src="assets/images/logo.png" alt="CauseConnect Logo" style="height:56px; margin:0 auto 16px; object-fit:contain;">
      <h1>Welcome Back</h1>
      <p>Log in to champion causes, track contributions, and create impact.</p>
    </div>

    <div class="form-card">
      <div class="alert alert-danger hidden" id="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In to CauseConnect</button>

        <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--color-border); text-align:center;">
          <p class="text-gray mb-8" style="font-size:0.8rem; font-weight:600;">⚡ Quick Demo Login (from MySQL):</p>
          <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
            <button type="button" class="chip-sm" style="cursor:pointer;" onclick="quickFillLogin('alice@test.com', '1234')">Alice (Creator)</button>
            <button type="button" class="chip-sm" style="cursor:pointer;" onclick="quickFillLogin('bob@test.com', '1234')">Bob (Contributor)</button>
            <a href="admin-login.html" class="chip-sm" style="cursor:pointer; text-decoration:none;">Admin Portal</a>
          </div>
        </div>
      </form>
    </div>

    <p class="auth-switch">Don't have an account? <a href="register.html">Sign Up for CauseConnect</a></p>
    <p class="auth-switch" style="font-size:0.8rem; margin-top:8px;">Platform administrator? <a href="admin-login.html">Admin Login Portal</a></p>
  </div>
</div>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar();
  renderFooter();
  initLoginPage();
</script>
</body>
</html>
