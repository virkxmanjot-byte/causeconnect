<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Causes - CauseConnect</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-layout">
  <div id="dashboard-sidebar-mount"></div>

  <main class="dash-main">
    <button class="sidebar-mobile-toggle" id="sidebar-toggle">☰ Menu</button>

    <div class="dash-topbar reveal-up">
      <div>
        <h1>My Causes</h1>
        <p>Manage causes you have initiated, review funds raised, and post updates.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="campaign-updates.html" class="btn btn-secondary btn-sm">📢 Post Milestone Update</a>
        <a href="create-campaign.html" class="btn btn-primary btn-sm">+ Start a Cause</a>
      </div>
    </div>

    <div class="panel reveal delay-100" id="my-campaigns-table">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Title</th><th>Category</th><th>Goal</th><th>Raised</th><th>Status</th><th>Created</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="my-campaigns-body"></tbody>
        </table>
      </div>
    </div>

    <div class="empty-state hidden reveal" id="my-campaigns-empty">
      <div style="font-size:3rem; margin-bottom:12px;">🌱</div>
      <h3>No causes launched yet</h3>
      <p class="mb-16">Start your first cause and rally supporters around your mission.</p>
      <a href="create-campaign.html" class="btn btn-primary">Start a Cause Now</a>
    </div>
  </main>
</div>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar("dashboard");
  renderCreatorSidebar("my-campaigns");
  renderFooter();
  initMyCampaignsPage();
</script>
</body>
</html>
