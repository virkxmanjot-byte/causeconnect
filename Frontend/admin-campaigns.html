<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Causes - CauseConnect Admin</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-layout">
  <div id="admin-sidebar-mount"></div>

  <main class="dash-main">
    <button class="sidebar-mobile-toggle" id="sidebar-toggle">☰ Menu</button>

    <div class="dash-topbar reveal">
      <div>
        <h1>Cause Verification & Moderation</h1>
        <p>Review, verify, approve, or reject community causes submitted to CauseConnect.</p>
      </div>
      <div>
        <a href="admin-dashboard.html" class="btn btn-secondary btn-sm">← Back to Overview</a>
      </div>
    </div>

    <div class="panel reveal delay-1">
      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="campaign-search" class="input" placeholder="Filter causes by title or category...">
        </div>
        <select id="status-filter" class="input" style="max-width:180px;">
          <option value="All">All statuses</option>
          <option value="Pending">Pending Review</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Cause Title</th><th>Category</th><th>Goal</th><th>Raised</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="admin-campaigns-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar();
  renderAdminSidebar("campaigns");
  initAdminCampaignsPage();
</script>
</body>
</html>
