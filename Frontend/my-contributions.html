<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Donations - CauseConnect</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-layout">
  <div id="dashboard-sidebar-mount"></div>

  <main class="dash-main">
    <button class="sidebar-mobile-toggle" id="sidebar-toggle">☰ Menu</button>

    <div class="dash-topbar reveal">
      <div>
        <h1>My Donations</h1>
        <p>A transparent ledger of every verified cause you have championed.</p>
      </div>
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(2,1fr);max-width:520px;">
      <div class="stat-card reveal delay-1">
        <div class="stat-label">Total Impact Contributed</div>
        <div class="stat-value" id="total-contributed">₹0</div>
      </div>
      <div class="stat-card reveal delay-2">
        <div class="stat-label">Causes Supported</div>
        <div class="stat-value" id="total-campaigns-supported">0</div>
      </div>
    </div>

    <div class="panel reveal delay-3" id="my-contributions-table">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Cause Title</th><th>Category</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="my-contributions-body"></tbody>
        </table>
      </div>
    </div>

    <div class="empty-state hidden" id="my-contributions-empty">
      <div style="font-size:3rem; margin-bottom:12px;">🤝</div>
      <h3>No donations recorded yet</h3>
      <p class="mb-16">Browse verified causes and support initiatives close to your heart.</p>
      <a href="campaigns.html" class="btn btn-primary">Explore Causes</a>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar("dashboard");
  renderDashboardSidebar("my-contributions");
  initMyContributionsPage();
</script>
</body>
</html>
