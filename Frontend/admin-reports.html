<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics & Reports - CauseConnect Admin</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-layout">
  <div id="admin-sidebar-mount"></div>

  <main class="dash-main" id="admin-reports-root">
    <button class="sidebar-mobile-toggle" id="sidebar-toggle">☰ Menu</button>

    <div class="dash-topbar">
      <div>
        <h1>CauseConnect Platform Reports</h1>
        <p>Comprehensive breakdown of funds raised, verified causes, and category distributions.</p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Impact Funded</div>
        <div class="stat-value" id="report-total-raised">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Causes</div>
        <div class="stat-value" id="report-total-campaigns">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Causes</div>
        <div class="stat-value" id="report-approved-campaigns">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Donations</div>
        <div class="stat-value" id="report-total-contributions">0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Funds Mobilized by Cause Category</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Category</th><th>Causes</th><th>Impact Share</th><th>Total Raised</th></tr></thead>
          <tbody id="category-report-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar();
  renderAdminSidebar("reports");
  initAdminReportsPage();
</script>
</body>
</html>
