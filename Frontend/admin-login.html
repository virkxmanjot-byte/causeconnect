<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal Login - CauseConnect</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--color-dark);">

<div class="auth-wrap" style="min-height:100vh;">
  <div class="auth-card">
    <div class="auth-head">
      <div style="display:flex; justify-content:center; margin-bottom:18px;">
        <img src="assets/images/logo.png" alt="CauseConnect Logo" style="height:60px; object-fit:contain; background:#fff; padding:6px 12px; border-radius:12px;">
      </div>
      <h1 style="color:#fff;">CauseConnect Admin</h1>
      <p style="color:#94A3B8;">Restricted access — authorized administrators only.</p>
    </div>

    <div class="form-card">
      <div class="alert alert-danger hidden" id="admin-login-error"></div>
      <form id="admin-login-form">
        <div class="form-group">
          <label for="email">Admin Email</label>
          <input type="email" id="email" name="email" class="input" placeholder="admin@causeconnect.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In to Admin Portal</button>
        <p class="text-gray text-center mt-16" style="font-size:0.82rem;">Database credentials: admin@test.com / 1234</p>
      </form>
    </div>
    <p class="auth-switch" style="color:#94A3B8;"><a href="index.html" style="color:#fff; text-decoration:underline;">← Return to CauseConnect</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  initAdminLoginPage();
</script>
</body>
</html>
