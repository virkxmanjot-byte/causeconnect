<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - CauseConnect</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="auth-wrap">
  <div class="auth-card reveal-scale">
    <div class="auth-head">
      <img src="assets/images/logo.png" alt="CauseConnect Logo" style="height:56px; margin:0 auto 16px; object-fit:contain;">
      <h1>Join CauseConnect</h1>
      <p>Connect People. Fund Causes. Create Impact.</p>
    </div>

    <div class="form-card">
      <div class="role-toggle mb-16">
        <button type="button" class="active" data-role="creator">📢 Cause Creator</button>
        <button type="button" data-role="contributor">🌱 Contributor / Backer</button>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="input" placeholder="Your full name" required>
          <div class="field-error" data-error-for="name"></div>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="input" placeholder="you@example.com" required>
          <div class="field-error" data-error-for="email"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="input" placeholder="At least 6 characters" required>
            <div class="field-error" data-error-for="password"></div>
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="input" placeholder="Re-enter password" required>
            <div class="field-error" data-error-for="confirm_password"></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create CauseConnect Account</button>
      </form>
    </div>

    <p class="auth-switch">Already registered? <a href="login.html">Log In</a></p>
  </div>
</div>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar();
  renderFooter();
  initRegisterPage();
</script>
</body>
</html>
