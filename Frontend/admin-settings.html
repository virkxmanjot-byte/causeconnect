<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - CauseConnect Admin</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-layout">
  <div id="admin-sidebar-mount"></div>

  <main class="dash-main">
    <button class="sidebar-mobile-toggle" id="sidebar-toggle">☰ Menu</button>

    <div class="dash-topbar">
      <div>
        <h1>Platform Settings</h1>
        <p>Configure general CauseConnect platform policies and parameters.</p>
      </div>
    </div>

    <div class="form-card" style="max-width:560px;">
      <form id="admin-settings-form">
        <div class="form-group">
          <label for="platform_name">Platform Name</label>
          <input type="text" id="platform_name" name="platform_name" class="input" value="CauseConnect" readonly>
        </div>
        <div class="form-group">
          <label for="min_contribution">Minimum Contribution Amount (₹)</label>
          <input type="number" id="min_contribution" name="min_contribution" class="input" min="1" value="10">
        </div>
        <div class="form-group">
          <label for="support_email">Support Contact Email</label>
          <input type="email" id="support_email" name="support_email" class="input" value="support@causeconnect.com">
        </div>
        <div class="form-group flex items-center gap-8">
          <input type="checkbox" id="auto_approve" name="auto_approve" style="width:18px;height:18px;">
          <label for="auto_approve" style="margin:0;">Instant Cause Approval (bypass manual review)</label>
        </div>
        <button type="submit" class="btn btn-primary">Save Platform Settings</button>
      </form>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar();
  renderAdminSidebar("settings");
  initAdminSettingsPage();
</script>
</body>
</html>
