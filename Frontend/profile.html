<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - CauseConnect</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="dash-layout">
  <div id="dashboard-sidebar-mount"></div>

  <main class="dash-main" id="profile-root">
    <button class="sidebar-mobile-toggle" id="sidebar-toggle">☰ Menu</button>

    <div class="dash-topbar reveal">
      <div>
        <h1>Account Profile</h1>
        <p>Manage your account settings and personal details on CauseConnect.</p>
      </div>
    </div>

    <div class="details-layout">
      <div class="form-card reveal">
        <h3 class="mb-16">Profile Information</h3>
        <form id="profile-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" class="input" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="input" disabled style="background:#F1F5F9; color:#64748B;">
            <div class="hint">Registered email is linked to your donation receipts.</div>
          </div>
          <button type="submit" class="btn btn-primary">Save Profile</button>
        </form>
      </div>

      <div class="reveal delay-1">
        <div class="form-card text-center mb-24">
          <div class="sidebar-user" style="justify-content:center;border:none;margin-bottom:0;padding-bottom:0;">
            <span class="avatar" id="profile-avatar" style="width:64px;height:64px;font-size:1.4rem;"></span>
          </div>
          <h3 class="mt-16" id="profile-name"></h3>
          <p class="text-gray" id="profile-email"></p>
          <span class="badge badge-info mt-8" id="profile-role"></span>
        </div>

        <div class="stat-grid" style="grid-template-columns:1fr;">
          <div class="stat-card">
            <div class="stat-label">Causes Initiated</div>
            <div class="stat-value" id="profile-campaign-count">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Contributions Made</div>
            <div class="stat-value" id="profile-contribution-count">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Impact Funded</div>
            <div class="stat-value" id="profile-contribution-total">₹0</div>
          </div>
        </div>

        <button class="btn btn-secondary btn-block mt-16" id="profile-logout">Log Out</button>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar("dashboard");
  renderDashboardSidebar("profile");
  initProfilePage();
</script>
</body>
</html>
