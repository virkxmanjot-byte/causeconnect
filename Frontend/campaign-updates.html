<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cause Updates & Impact Milestones - CauseConnect</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="container page-head reveal-up">
  <h1>Cause Updates & Milestones</h1>
  <p>Track direct field updates, photo stories, and transparent deployment of funds across all verified initiatives.</p>
</div>

<div class="container section" style="padding-top:24px;">
  <!-- Creator Post Update Card (Shown for creators with approved causes) -->
  <div id="creator-post-update-section" class="form-card mb-32 hidden reveal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;">
      <div>
        <h3 style="font-size:1.25rem;">📢 Post a Field Progress Update</h3>
        <p class="text-gray" style="font-size:0.88rem;">Keep your backers motivated and informed with transparent milestones.</p>
      </div>
      <span class="chip-sm">Creator Tool</span>
    </div>

    <form id="campaign-update-form">
      <div class="form-group">
        <label for="form-campaign-select">Select Cause</label>
        <select id="form-campaign-select" class="input" required></select>
      </div>
      <div class="form-group">
        <label for="update_title">Update Headline</label>
        <input type="text" id="update_title" name="update_title" class="input" placeholder="e.g. Relief Kits Delivered to 45 Families" required>
      </div>
      <div class="form-group">
        <label for="update_message">Detailed Progress Message</label>
        <textarea id="update_message" name="update_message" class="input" placeholder="Describe the milestones achieved, items procured, and message to supporters..." required style="min-height:90px;"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Publish Milestone Update</button>
    </form>
  </div>

  <!-- Filter Toolbar -->
  <div class="flex gap-16 mb-24 reveal" style="align-items:center; justify-content:space-between; flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:10px; width:100%; max-width:440px;">
      <label for="update-campaign-filter" style="font-weight:600; font-size:0.9rem; white-space:nowrap; color:var(--color-dark);">Filter Cause:</label>
      <select id="update-campaign-filter" class="input" style="flex:1;">
        <option value="All">All Cause Milestones</option>
      </select>
    </div>
    <a href="campaigns.html" class="btn btn-secondary btn-sm">Explore All Causes →</a>
  </div>

  <!-- Updates Timeline Feed -->
  <div class="timeline-feed reveal delay-100" id="campaign-updates-timeline"></div>
</div>

<div id="footer-mount"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  renderNavbar("updates");
  renderFooter();
  initCampaignUpdatesPage();
</script>
</body>
</html>
